<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Туристична агенція{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a class="logo" href="{{ url_for('home') }}">Мандрівка</a>
        <nav>
            <a href="{{ url_for('home') }}">Головна</a>
            <a href="{{ url_for('about') }}">Про нас</a>
            <a href="{{ url_for('tours') }}">Тури</a>
            <a href="{{ url_for('gallery') }}">Галерея</a>
            <a href="{{ url_for('contacts') }}">Контакти</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer><p>© 2025 Туристична агенція «Мандрівка»</p></footer>
</body>
</html>
